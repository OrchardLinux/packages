name: Follow sources
# Keeps the packages current without anyone bumping a pin by hand:
#
# - a source repository that a package follows (packages/NAME/source.json,
#   "track") made a release: the pin moves to that release's tag, is committed
#   to main, and the build builds that package. Pushes to a source publish
#   nothing. Found by polling, and at once when the source repository sends
#   `source-updated` (repository_dispatch with client_payload
#   {"repo": "OrchardLinux/mesa", "tag": "v27.0.0"}; that needs a token in the
#   sending repository, which does not exist yet). orchard's kernel packages
#   move with `tools/pkgrepo orchard-release VERSION`;
# - Arch moved a library a published package is locked to (LLVM under Mesa):
#   the package's pkgrel is raised and it is built again against today's Arch.
on:
  schedule:
    - cron: '7,27,47 * * * *'
    - cron: '37 */6 * * *'
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
    inputs:
      package:
        description: Only this package's pin
        required: false
      tag:
        description: Move to this release tag instead of the newest release
        required: false
      installable:
        description: Check instead that the published packages still install
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: follow-sources
  cancel-in-progress: false
jobs:
  pins:
    if: github.event.schedule != '37 */6 * * *' && !inputs.installable
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          SENT_REPOSITORY: ${{ github.event.client_payload.repo }}
          SENT_TAG: ${{ github.event.client_payload.tag }}
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 tools/pkgrepo bump ${SENT_REPOSITORY:+--repository "$SENT_REPOSITORY"} \
            ${PACKAGE:+--package "$PACKAGE"} ${SENT_TAG:+--tag "$SENT_TAG"} ${TAG:+--tag "$TAG"}
      - env:
          GH_TOKEN: ${{ github.token }}
          MOVED: ${{ steps.bump.outputs.moved }}
        run: |
          ci/commit-and-build "${MOVED// /, }: the source's new release"
  installable:
    if: github.event.schedule == '37 */6 * * *' || inputs.installable
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve every published package against today's Arch
        run: |
          mkdir -p out
          ci/container aarch64 -v "$PWD:/repo:ro" -v "$PWD/out:/out" \
            -e ORCHARD_SERVER_BASE="https://github.com/$GITHUB_REPOSITORY/releases/download" \
            -- bash /repo/ci/container-installable
      - name: Build again what no longer installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t broken < <(sort -u out/broken)
          (( ${#broken[@]} )) || exit 0
          python3 tools/pkgrepo rebuild --published-only "${broken[@]}"
          names="${broken[*]}"
          ci/commit-and-build "${names// /, }: build again for Arch's current libraries"
